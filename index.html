<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📰 快点电子报刊 - 简约阅读</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        iframe { border: none; width: 100%; height: 100%; }
        .sidebar-item { transition: all 0.2s ease; }
        .rotate-icon { transition: transform 0.3s ease; }
        .is-active .rotate-icon { transform: rotate(90deg); }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans overflow-hidden" x-data="newsApp()">

    <header class="h-16 border-b bg-white flex items-center justify-between px-6 sticky top-0 z-50 shadow-sm">
        <div class="flex items-center">
            <h1 class="text-xl font-bold tracking-tighter text-indigo-600 flex items-center">
                <span class="mr-2">📰</span>快点电子报刊
            </h1>
        </div>

        <div class="flex items-center space-x-3 md:space-x-5">
            <a href="https://github.com/muzihuaner/baokan" target="_blank" class="p-2 text-gray-500 hover:text-black transition-colors" title="源代码">
                <svg class="h-6 w-6" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd" /></svg>
            </a>

            <button @click="showAbout = true" class="p-2 text-gray-500 hover:text-indigo-600 transition-colors" title="关于本站">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            </button>

            <nav class="flex bg-gray-100 p-1 rounded-xl text-sm font-medium">
                <button @click="tab = 'domestic'; initFirstGroup();" 
                    :class="tab === 'domestic' ? 'bg-white shadow-sm text-indigo-600' : 'text-gray-500 hover:text-gray-700'" 
                    class="px-4 py-1.5 rounded-lg transition-all">国内</button>
                <button @click="tab = 'international'; initFirstGroup();" 
                    :class="tab === 'international' ? 'bg-white shadow-sm text-indigo-600' : 'text-gray-500 hover:text-gray-700'" 
                    class="px-4 py-1.5 rounded-lg transition-all ml-1">国外</button>
            </nav>

            <div class="flex items-center space-x-1 border-l pl-4" x-show="currentUrl">
                <button @click="toggleFullScreen()" class="p-2 hover:bg-gray-100 rounded-lg text-gray-600 transition" title="全屏">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" /></svg>
                </button>
                <button @click="openInNewTab()" class="p-2 hover:bg-gray-100 rounded-lg text-gray-600 transition" title="新标签页">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg>
                </button>
                <button @click="currentUrl = ''" class="px-2 py-1 text-xs font-bold text-red-500 hover:bg-red-50 rounded-lg transition">关闭</button>
            </div>
        </div>
    </header>

    <main class="flex h-[calc(100vh-64px)] overflow-hidden">
        <aside class="w-72 border-r bg-white flex flex-col shadow-inner">
            <div class="flex-1 overflow-y-auto no-scrollbar p-4">
                <template x-for="(group, index) in (tab === 'domestic' ? data.domestic : data.international)" :key="group.region || group.country">
                    <div class="mb-2 border-b border-gray-50 pb-2">
                        <button @click="toggleGroup(group.region || group.country)"
                            :class="isExpanded(group.region || group.country) ? 'is-active text-indigo-600' : 'text-gray-500'"
                            class="flex items-center justify-between w-full px-2 py-3 hover:bg-gray-50 rounded-lg transition-colors group">
                            <div class="flex items-center">
                                <span class="w-1.5 h-1.5 rounded-full mr-3" :class="tab === 'domestic' ? 'bg-indigo-400' : 'bg-emerald-400'"></span>
                                <span class="text-xs font-bold uppercase tracking-widest" x-text="group.region || group.country"></span>
                            </div>
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 rotate-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
                        </button>

                        <ul x-show="isExpanded(group.region || group.country)" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 transform -translate-y-2" x-transition:enter-end="opacity-100 transform translate-y-0" class="mt-1 space-y-1">
                            <template x-for="paper in group.papers" :key="paper.name">
                                <li>
                                    <button @click="loadPaper(paper.url)" 
                                        :class="currentUrl === paper.url ? 'bg-indigo-50 text-indigo-700 font-semibold' : 'text-gray-600 hover:bg-gray-50'" 
                                        class="sidebar-item w-full text-left px-8 py-2 rounded-lg text-[13px]" x-text="paper.name"></button>
                                </li>
                            </template>
                        </ul>
                    </div>
                </template>
            </div>

            <div class="p-4 border-t bg-gray-50">
                <div class="bg-white p-3 rounded-lg border border-gray-100 shadow-sm text-center">
                    <p class="text-[10px] text-gray-400 leading-relaxed italic">免责声明：本站仅提供链接导航，内容均来自公开网络。版权归原报刊所有，如有侵权请联系删除。</p>
                </div>
            </div>
        </aside>

        <section class="flex-1 bg-gray-200 relative" id="reader-container">
            <template x-if="!currentUrl">
                <div class="h-full flex flex-col items-center justify-center text-gray-400">
                    <div class="bg-white p-8 rounded-full shadow-sm mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 opacity-20" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
                    </div>
                    <p class="text-xs tracking-widest uppercase font-semibold text-gray-400">请选择左侧报刊开启数字阅读</p>
                </div>
            </template>
            <template x-if="currentUrl">
                <iframe :src="currentUrl" allowfullscreen class="bg-white"></iframe>
            </template>
        </section>
    </main>

    <div x-show="showAbout" 
         x-transition:enter="transition ease-out duration-300" 
         x-transition:enter-start="opacity-0" 
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         class="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-black/50 backdrop-blur-sm"
         @click.self="showAbout = false">
        
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-indigo-600"></div>
            <button @click="showAbout = false" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
            
            <div class="text-center mb-6">
                <div class="inline-block p-4 bg-indigo-50 rounded-full mb-4">
                    <span class="text-4xl">📰</span>
                </div>
                <h2 class="text-2xl font-bold text-gray-800">关于快点电子报刊</h2>
            </div>
            
            <div class="space-y-4 text-gray-600 text-sm leading-relaxed">
                <p>这是一个为数字阅读爱好者设计的简约电子报刊聚合平台。我们致力于收集全球优质报刊链接，为您提供清爽、无干扰的阅读体验。</p>
                <div class="bg-gray-50 p-4 rounded-xl border border-gray-100">
                    <ul class="space-y-2">
                        <li class="flex items-center"><span class="w-1.5 h-1.5 bg-indigo-400 rounded-full mr-2"></span> 每日自动同步公开报刊</li>
                        <li class="flex items-center"><span class="w-1.5 h-1.5 bg-indigo-400 rounded-full mr-2"></span> 支持国内外分级浏览</li>
                        <li class="flex items-center"><span class="w-1.5 h-1.5 bg-indigo-400 rounded-full mr-2"></span> 纯净沉浸式阅读模式</li>
                    </ul>
                </div>
                <p class="text-xs text-gray-400">Version 1.2.0 • Made with ❤️</p>
            </div>
            
            <button @click="showAbout = false" class="w-full mt-8 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-indigo-200 transition">
                开始阅读
            </button>
        </div>
    </div>

    <script>
        function newsApp() {
            return {
                tab: 'domestic',
                currentUrl: '',
                data: { domestic: [], international: [] },
                activeGroups: [],
                showAbout: false, // 控制关于弹窗
                
                async init() {
                    try {
                        const response = await fetch('data.json');
                        this.data = await response.json();
                        this.initFirstGroup();
                    } catch (e) {
                        console.error("加载数据失败:", e);
                    }
                },

                initFirstGroup() {
                    this.activeGroups = [];
                    const currentList = this.tab === 'domestic' ? this.data.domestic : this.data.international;
                    if (currentList && currentList.length > 0) {
                        const firstGroupName = currentList[0].region || currentList[0].country;
                        this.activeGroups.push(firstGroupName);
                    }
                },

                toggleGroup(name) {
                    if (this.activeGroups.includes(name)) {
                        this.activeGroups = this.activeGroups.filter(g => g !== name);
                    } else {
                        this.activeGroups.push(name);
                    }
                },

                isExpanded(name) {
                    return this.activeGroups.includes(name);
                },

                loadPaper(url) {
                    this.currentUrl = url;
                },

                openInNewTab() {
                    if (this.currentUrl) window.open(this.currentUrl, '_blank');
                },

                toggleFullScreen() {
                    const elem = document.getElementById('reader-container');
                    if (!document.fullscreenElement) {
                        elem.requestFullscreen().catch(err => {
                            alert(`无法开启全屏: ${err.message}`);
                        });
                    } else {
                        document.exitFullscreen();
                    }
                }
            }
        }
    </script>
</body>
</html>
